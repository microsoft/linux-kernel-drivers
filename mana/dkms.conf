PACKAGE_NAME="mana-compat"
# Version scheme: <MANA internal>+linux<source>+compat<REV>
#   <MANA internal> = MANA_{MAJOR,MINOR,MICRO}_VERSION from
#                     driver/include/net/mana/mana.h (the driver's own version)
#   <source>        = LINUX_SOURCE_VERSION from ./source-version (the Linux tree
#                     the verbatim driver/ was vendored out of)
#   <REV>           = PACKAGE_REVISION from ./package-revision, the out-of-tree
#                     packaging revision. The two upstream-derived halves above do
#                     not move for a compat-only or packaging-only change, so this
#                     trailing revision is what makes such a build a distinct,
#                     newer version -- without it DKMS reuses the cached .ko on
#                     "upgrade" and the old driver stays loaded (stale-driver trap).
# Auto-derived by scripts/gen-version.sh; refresh with `make set-version`.
PACKAGE_VERSION="0.1.1+linux7.2.0~rc4+compat5"

# Distinct module name so the in-tree `mana` can remain blacklisted without the
# blacklist also catching this out-of-tree build. The .ko links at the build-dir
# root even though the objects live under driver/.
BUILT_MODULE_NAME[0]="mana-compat"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/extra"

# Route the checked DKMS build through the module's top-level Makefile. This is
# deliberately part of MAKE rather than PRE_BUILD: older DKMS releases can skip
# a non-executable PRE_BUILD hook or continue after it fails. The Makefile always
# re-runs ./configure against ${kernel_source_dir}, and make propagates any probe
# failure before kbuild can compile with stale or guessed feature flags.
#
# Keep MAKE[0] beginning with literal "make": DKMS injects its parallelism and
# KERNELRELEASE arguments by replacing that leading word.
MAKE[0]="make KDIR=${kernel_source_dir} all"
CLEAN="make KDIR=${kernel_source_dir} clean"

AUTOINSTALL="yes"
